services:
  api:
    build: .
    image: tape-audit-scheduler:latest
    container_name: tape-audit-scheduler
    ports:
      - "8000:8000"
    environment:
      AUDIT_DB_PATH: /data/audit.db
    volumes:
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  audit-data:
